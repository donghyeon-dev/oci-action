name: Monitor OCI Free Tier Usage

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/monitor-usage.yml'
      - 'README.md'
  schedule:
    # Run once per day at 00:17 UTC. GitHub schedules use UTC.
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      network_warning_tb:
        description: 'Warn when this month VNIC egress reaches this many TiB'
        required: false
        default: '8'
        type: string
      network_critical_tb:
        description: 'Fail when this month VNIC egress reaches this many TiB'
        required: false
        default: '10'
        type: string
      block_warning_gb:
        description: 'Warn when block + boot volume capacity reaches this many GB'
        required: false
        default: '180'
        type: string

permissions:
  contents: read

concurrency:
  group: oci-free-tier-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NETWORK_WARNING_TB: ${{ inputs.network_warning_tb || '8' }}
      NETWORK_CRITICAL_TB: ${{ inputs.network_critical_tb || '10' }}
      BLOCK_WARNING_GB: ${{ inputs.block_warning_gb || '180' }}
      A1_FREE_OCPUS: '2'
      A1_FREE_MEMORY_GB: '12'
      BLOCK_FREE_GB: '200'

    steps:
      - name: Initialize OCI CLI from repository secrets
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: iam region list
          silent: true

      - name: Collect raw OCI usage data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oci-monitor"

          month_start="$(date -u +%Y-%m-01T00:00:00Z)"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Usage API MONTHLY queries require UTC hour/minute/second/fraction precision to be zero.
          # Use the current UTC day boundary as the billing-side end point. Live VNIC metrics still use now.
          usage_end="$(date -u +%Y-%m-%dT00:00:00Z)"
          echo "MONTH_START=$month_start" >> "$GITHUB_ENV"
          echo "MONTH_END=$now" >> "$GITHUB_ENV"
          echo "USAGE_END=$usage_end" >> "$GITHUB_ENV"

          # On the 1st of each UTC month the previous month is fully closed, so emit an
          # extra month-end summary covering that complete billing period.
          day_of_month="$(date -u +%d)"
          prev_month_start="$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m-01T00:00:00Z)"
          prev_month_end="$month_start"
          prev_month_label="$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"
          echo "PREV_MONTH_START=$prev_month_start" >> "$GITHUB_ENV"
          echo "PREV_MONTH_END=$prev_month_end" >> "$GITHUB_ENV"
          echo "PREV_MONTH_LABEL=$prev_month_label" >> "$GITHUB_ENV"
          if [ "$day_of_month" = "01" ]; then
            echo "IS_MONTH_END_REPORT=true" >> "$GITHUB_ENV"
          else
            echo "IS_MONTH_END_REPORT=false" >> "$GITHUB_ENV"
          fi

          echo "Collecting active A1 instances..."
          "$HOME/.local/bin/oci" compute instance list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --all \
            --output json \
            > "$RUNNER_TEMP/oci-monitor/instances.json"

          echo "Collecting availability domains..."
          "$HOME/.local/bin/oci" iam availability-domain list \
            --compartment-id "$OCI_CLI_TENANCY" \
            --all \
            --output json \
            > "$RUNNER_TEMP/oci-monitor/availability-domains.json"

          echo "Collecting boot volumes and block volumes..."
          jq -r '.data[].name' "$RUNNER_TEMP/oci-monitor/availability-domains.json" | while read -r ad; do
            "$HOME/.local/bin/oci" bv boot-volume list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --availability-domain "$ad" \
              --all \
              --output json \
              > "$RUNNER_TEMP/oci-monitor/boot-volumes-${ad//[^A-Za-z0-9_.-]/_}.json"

            "$HOME/.local/bin/oci" bv volume list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --availability-domain "$ad" \
              --all \
              --output json \
              > "$RUNNER_TEMP/oci-monitor/block-volumes-${ad//[^A-Za-z0-9_.-]/_}.json"
          done

          echo "Collecting Usage API rows for this month..."
          set +e
          "$HOME/.local/bin/oci" usage-api usage-summary request-summarized-usages \
            --tenant-id "$OCI_CLI_TENANCY" \
            --time-usage-started "$month_start" \
            --time-usage-ended "$usage_end" \
            --granularity MONTHLY \
            --query-type USAGE \
            --group-by '["service","skuName","unit","resourceId"]' \
            --is-aggregate-by-time true \
            --output json \
            > "$RUNNER_TEMP/oci-monitor/usage-api.json" \
            2> "$RUNNER_TEMP/oci-monitor/usage-api.err"
          usage_exit=$?
          set -e
          echo "$usage_exit" > "$RUNNER_TEMP/oci-monitor/usage-api.exit"
          if [ "$usage_exit" -ne 0 ]; then
            echo "::warning::Usage API query failed. Continuing with Compute/Block/VNIC metric checks."
            sed -n '1,80p' "$RUNNER_TEMP/oci-monitor/usage-api.err" || true
            printf '{"data":[]}' > "$RUNNER_TEMP/oci-monitor/usage-api.json"
          fi

          if [ "${IS_MONTH_END_REPORT:-false}" = "true" ]; then
            echo "Collecting Usage API rows for the closed previous month ($PREV_MONTH_LABEL)..."
            set +e
            "$HOME/.local/bin/oci" usage-api usage-summary request-summarized-usages \
              --tenant-id "$OCI_CLI_TENANCY" \
              --time-usage-started "$PREV_MONTH_START" \
              --time-usage-ended "$PREV_MONTH_END" \
              --granularity MONTHLY \
              --query-type USAGE \
              --group-by '["service","skuName","unit","resourceId"]' \
              --is-aggregate-by-time true \
              --output json \
              > "$RUNNER_TEMP/oci-monitor/usage-api-prev.json" \
              2> "$RUNNER_TEMP/oci-monitor/usage-api-prev.err"
            prev_usage_exit=$?
            set -e
            echo "$prev_usage_exit" > "$RUNNER_TEMP/oci-monitor/usage-api-prev.exit"
            if [ "$prev_usage_exit" -ne 0 ]; then
              echo "::warning::Previous-month Usage API query failed."
              sed -n '1,80p' "$RUNNER_TEMP/oci-monitor/usage-api-prev.err" || true
              printf '{"data":[]}' > "$RUNNER_TEMP/oci-monitor/usage-api-prev.json"
            fi
          fi

      - name: Summarize and validate monitor values against raw OCI data
        id: summarize
        shell: python
        run: |
          import glob, json, os, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP']) / 'oci-monitor'
          oci = str(Path.home() / '.local/bin/oci')
          compartment_id = os.environ['OCI_COMPARTMENT_ID']
          month_start = os.environ['MONTH_START']
          month_end = os.environ['MONTH_END']
          is_month_end_report = os.environ.get('IS_MONTH_END_REPORT', 'false') == 'true'
          prev_month_start = os.environ.get('PREV_MONTH_START', '')
          prev_month_end = os.environ.get('PREV_MONTH_END', '')
          prev_month_label = os.environ.get('PREV_MONTH_LABEL', '')

          def parse_utc(value):
              return datetime.fromisoformat(value.replace('Z', '+00:00'))

          def period_label(start, end):
              # Human-readable aggregation window, e.g. "6/1~6/10".
              s, e = parse_utc(start), parse_utc(end)
              return f"{s.month}/{s.day}~{e.month}/{e.day}"

          current_period_label = period_label(month_start, month_end)

          def load_json(path, default):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return default

          def run_json(args):
              out = subprocess.check_output([oci] + args, text=True)
              return json.loads(out)

          def num(value, default=0.0):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return default

          instances_raw = load_json(temp / 'instances.json', {'data': []}).get('data', [])
          a1_instances = [
              i for i in instances_raw
              if i.get('shape') == 'VM.Standard.A1.Flex'
              and i.get('lifecycle-state') not in ('TERMINATED', 'TERMINATING')
          ]
          a1_ocpus = sum(num((i.get('shape-config') or {}).get('ocpus')) for i in a1_instances)
          a1_memory = sum(num((i.get('shape-config') or {}).get('memory-in-gbs')) for i in a1_instances)

          volume_rows = []
          for pattern, kind in [('boot-volumes-*.json', 'boot'), ('block-volumes-*.json', 'block')]:
              for path in glob.glob(str(temp / pattern)):
                  for vol in load_json(path, {'data': []}).get('data', []):
                      state = vol.get('lifecycle-state')
                      if state in ('TERMINATED', 'TERMINATING'):
                          continue
                      volume_rows.append({
                          'kind': kind,
                          'display_name': vol.get('display-name'),
                          'id': vol.get('id'),
                          'size_gb': num(vol.get('size-in-gbs')),
                          'state': state,
                      })
          total_volume_gb = sum(v['size_gb'] for v in volume_rows)

          vnic_ids = []
          for inst in a1_instances:
              attachments = run_json([
                  'compute', 'vnic-attachment', 'list',
                  '--compartment-id', compartment_id,
                  '--instance-id', inst['id'],
                  '--all', '--output', 'json'
              ]).get('data', [])
              for attachment in attachments:
                  if attachment.get('lifecycle-state') == 'ATTACHED' and attachment.get('vnic-id'):
                      vnic_ids.append(attachment['vnic-id'])
          vnic_ids = sorted(set(vnic_ids))

          # VnicToNetworkBytes is the raw OCI Monitoring metric for bytes sent by each VNIC.
          # This is used as a near-real-time approximation for monthly outbound traffic.
          # The Usage API cost/usage rows below are kept as the billing-side cross-check.
          def sum_vnic_egress(start, end):
              total = 0.0
              rows = []
              for vnic_id in vnic_ids:
                  query = f'VnicToNetworkBytes[1h]{{resourceId = "{vnic_id}"}}.sum()'
                  data = run_json([
                      'monitoring', 'metric-data', 'summarize-metrics-data',
                      '--compartment-id', compartment_id,
                      '--namespace', 'oci_vcn',
                      '--query-text', query,
                      '--start-time', start,
                      '--end-time', end,
                      '--resolution', '1h',
                      '--output', 'json'
                  ]).get('data', [])
                  subtotal = 0.0
                  for series in data:
                      for point in series.get('aggregated-datapoints', []) or []:
                          subtotal += num(point.get('value'))
                  rows.append({'vnic_id': vnic_id, 'egress_bytes': subtotal})
                  total += subtotal
              return total, rows

          vnic_egress_bytes, vnic_metric_rows = sum_vnic_egress(month_start, month_end)

          def parse_usage(json_path, exit_path):
              exit_code = 1
              try:
                  exit_code = int((temp / exit_path).read_text().strip() or '1')
              except Exception:
                  pass
              obj = load_json(temp / json_path, {'data': []})
              raw = obj.get('data', [])
              if isinstance(raw, dict):
                  raw = raw.get('items') or raw.get('usage') or []
              if not isinstance(raw, list):
                  raw = []
              rows = []
              outbound_quantity = 0.0
              cost_total = 0.0
              for row in raw:
                  if not isinstance(row, dict):
                      continue
                  service = str(row.get('service') or '')
                  sku = str(row.get('sku-name') or row.get('skuName') or '')
                  unit = str(row.get('unit') or '')
                  qty = num(row.get('computed-quantity') or row.get('computedQuantity') or row.get('quantity'))
                  cost = num(row.get('computed-amount') or row.get('computedAmount'))
                  cost_total += cost
                  text = f'{service} {sku} {unit}'.lower()
                  if 'outbound' in text or 'data transfer' in text:
                      outbound_quantity += qty
                      rows.append({'service': service, 'sku': sku, 'unit': unit, 'quantity': qty, 'cost': cost})
              return {'exit': exit_code, 'rows': rows, 'outbound_quantity': outbound_quantity, 'cost': cost_total}

          current_usage = parse_usage('usage-api.json', 'usage-api.exit')
          usage_exit = current_usage['exit']
          usage_rows = current_usage['rows']
          outbound_usage_quantity = current_usage['outbound_quantity']
          usage_cost = current_usage['cost']

          def pct(used, limit):
              limit = num(limit)
              if limit <= 0:
                  return 0.0
              return (num(used) / limit) * 100.0

          a1_free_ocpus = num(os.environ['A1_FREE_OCPUS'])
          a1_free_memory_gb = num(os.environ['A1_FREE_MEMORY_GB'])
          block_free_gb = num(os.environ['BLOCK_FREE_GB'])
          network_free_tib = 10.0
          a1_ocpus_percent = pct(a1_ocpus, a1_free_ocpus)
          a1_memory_percent = pct(a1_memory, a1_free_memory_gb)
          block_percent = pct(total_volume_gb, block_free_gb)
          network_tib = vnic_egress_bytes / (1024 ** 4)
          network_percent = pct(network_tib, network_free_tib)
          overall_risk_percent = max(a1_ocpus_percent, a1_memory_percent, block_percent, network_percent)

          summary = {
              'period_utc': {'start': month_start, 'end': month_end, 'label': current_period_label},
              'risk': {
                  'overall_percent': overall_risk_percent,
                  'a1_ocpus_percent': a1_ocpus_percent,
                  'a1_memory_percent': a1_memory_percent,
                  'block_storage_percent': block_percent,
                  'network_egress_percent': network_percent,
                  'note': 'Percentages compare current monitored usage with Always Free thresholds. A1 at 100% means the current documented free A1 allowance is fully allocated, not overage by itself.',
              },
              'a1': {
                  'active_instance_count': len(a1_instances),
                  'ocpus': a1_ocpus,
                  'memory_gb': a1_memory,
                  'free_ocpus': a1_free_ocpus,
                  'free_memory_gb': a1_free_memory_gb,
                  'instances': [
                      {
                          'display_name': i.get('display-name'),
                          'state': i.get('lifecycle-state'),
                          'ocpus': num((i.get('shape-config') or {}).get('ocpus')),
                          'memory_gb': num((i.get('shape-config') or {}).get('memory-in-gbs')),
                          'id': i.get('id'),
                      }
                      for i in a1_instances
                  ],
              },
              'block_storage': {
                  'total_gb': total_volume_gb,
                  'free_gb': block_free_gb,
                  'volumes': volume_rows,
              },
              'network': {
                  'vnic_to_network_bytes': vnic_egress_bytes,
                  'vnic_to_network_gib': vnic_egress_bytes / (1024 ** 3),
                  'vnic_to_network_tib': network_tib,
                  'free_tib': network_free_tib,
                  'warning_tib': num(os.environ['NETWORK_WARNING_TB']),
                  'critical_tib': num(os.environ['NETWORK_CRITICAL_TB']),
                  'vnic_metric_rows': vnic_metric_rows,
                  'usage_api_exit': usage_exit,
                  'usage_api_outbound_rows': usage_rows,
                  'usage_api_outbound_quantity': outbound_usage_quantity,
                  'usage_api_total_computed_amount': usage_cost,
              },
          }

          (temp / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))

          print('=== RAW OCI -> COMPUTED VALUE VALIDATION ===')
          print(f"A1 raw instances counted: {len(a1_instances)}")
          for item in summary['a1']['instances']:
              print(f"  - {item['display_name']} state={item['state']} ocpus={item['ocpus']} memory_gb={item['memory_gb']}")
          print(f"Computed A1 totals from raw instance shape-config: ocpus={a1_ocpus}, memory_gb={a1_memory}")
          print(f"Computed volume total from raw boot/block volume list: {total_volume_gb} GB across {len(volume_rows)} volumes")
          for row in vnic_metric_rows:
              print(f"VNIC metric raw subtotal: {row['vnic_id']} VnicToNetworkBytes={row['egress_bytes']:.0f}")
          print(f"Computed monthly VNIC egress: {vnic_egress_bytes:.0f} bytes = {summary['network']['vnic_to_network_gib']:.3f} GiB = {summary['network']['vnic_to_network_tib']:.6f} TiB")
          print(f"Risk percentages: overall={overall_risk_percent:.1f}% a1_ocpus={a1_ocpus_percent:.1f}% a1_memory={a1_memory_percent:.1f}% block={block_percent:.1f}% network={network_percent:.3f}%")
          print(f"Usage API exit={usage_exit}; outbound billing-side rows matched={len(usage_rows)}; outbound_quantity={outbound_usage_quantity}; total_computed_amount={usage_cost}")
          for row in usage_rows[:20]:
              print(f"  usage row: service={row['service']} sku={row['sku']} unit={row['unit']} quantity={row['quantity']} cost={row['cost']}")

          status = 'ok'
          messages = []
          if a1_ocpus > summary['a1']['free_ocpus'] or a1_memory > summary['a1']['free_memory_gb']:
              status = 'critical'
              messages.append(f"A1 allocation exceeds Always Free: {a1_ocpus} OCPU / {a1_memory} GB")
          if total_volume_gb > summary['block_storage']['free_gb']:
              status = 'critical'
              messages.append(f"Block+boot volumes exceed Always Free: {total_volume_gb} GB")
          elif total_volume_gb >= num(os.environ['BLOCK_WARNING_GB']):
              if status == 'ok':
                  status = 'warning'
              messages.append(f"Block+boot volumes near limit: {total_volume_gb} GB")
          tib = summary['network']['vnic_to_network_tib']
          if tib >= num(os.environ['NETWORK_CRITICAL_TB']):
              status = 'critical'
              messages.append(f"Monthly VNIC egress reached critical threshold: {tib:.3f} TiB")
          elif tib >= num(os.environ['NETWORK_WARNING_TB']):
              if status == 'ok':
                  status = 'warning'
              messages.append(f"Monthly VNIC egress reached warning threshold: {tib:.3f} TiB")
          if usage_cost > 0:
              status = 'critical'
              messages.append(f"Usage API reports non-zero computed amount: {usage_cost}")

          if not messages:
              messages.append('All monitored values are within configured thresholds.')

          # Month-end closing report: on the 1st of the month, compute the fully closed
          # previous month so the daily cadence is complemented by a final billing summary.
          prev_outputs = {}
          if is_month_end_report:
              prev_usage = parse_usage('usage-api-prev.json', 'usage-api-prev.exit')
              prev_vnic_bytes, _ = sum_vnic_egress(prev_month_start, prev_month_end)
              prev_tib = prev_vnic_bytes / (1024 ** 4)
              prev_outputs = {
                  'prev_month_label': prev_month_label,
                  'prev_vnic_egress_tib': f"{prev_tib:.6f}",
                  'prev_usage_cost': prev_usage['cost'],
                  'prev_outbound_quantity': prev_usage['outbound_quantity'],
              }
              print('=== MONTH-END CLOSING REPORT ===')
              print(f"Previous month {prev_month_label}: VNIC egress {prev_tib:.6f} TiB, "
                    f"Usage API cost {prev_usage['cost']}, outbound qty {prev_usage['outbound_quantity']}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"status={status}\n")
              fh.write(f"a1_ocpus={a1_ocpus}\n")
              fh.write(f"a1_memory_gb={a1_memory}\n")
              fh.write(f"block_total_gb={total_volume_gb}\n")
              fh.write(f"vnic_egress_tib={tib:.6f}\n")
              fh.write(f"usage_cost={usage_cost}\n")
              fh.write(f"overall_risk_percent={overall_risk_percent:.1f}\n")
              fh.write(f"a1_ocpus_percent={a1_ocpus_percent:.1f}\n")
              fh.write(f"a1_memory_percent={a1_memory_percent:.1f}\n")
              fh.write(f"block_percent={block_percent:.1f}\n")
              fh.write(f"network_percent={network_percent:.3f}\n")
              fh.write(f"period_label={current_period_label}\n")
              fh.write(f"month_end_report={'true' if is_month_end_report else 'false'}\n")
              for key, value in prev_outputs.items():
                  fh.write(f"{key}={value}\n")
              fh.write('message<<EOF\n' + '\n'.join(messages) + '\nEOF\n')

      - name: Upload raw monitor data
        uses: actions/upload-artifact@v4
        with:
          name: oci-monitor-raw-data
          path: |
            ${{ runner.temp }}/oci-monitor/*.json
            ${{ runner.temp }}/oci-monitor/*.err
            ${{ runner.temp }}/oci-monitor/*.exit
          retention-days: 14

      - name: Notify Telegram with usage percentages
        if: always() && github.event_name != 'pull_request' && steps.summarize.outputs.status != ''
        env:
          STATUS: ${{ steps.summarize.outputs.status }}
          MESSAGE: ${{ steps.summarize.outputs.message }}
          OVERALL_RISK_PERCENT: ${{ steps.summarize.outputs.overall_risk_percent }}
          A1_OCPUS: ${{ steps.summarize.outputs.a1_ocpus }}
          A1_MEMORY_GB: ${{ steps.summarize.outputs.a1_memory_gb }}
          BLOCK_TOTAL_GB: ${{ steps.summarize.outputs.block_total_gb }}
          VNIC_EGRESS_TIB: ${{ steps.summarize.outputs.vnic_egress_tib }}
          USAGE_COST: ${{ steps.summarize.outputs.usage_cost }}
          A1_OCPUS_PERCENT: ${{ steps.summarize.outputs.a1_ocpus_percent }}
          A1_MEMORY_PERCENT: ${{ steps.summarize.outputs.a1_memory_percent }}
          BLOCK_PERCENT: ${{ steps.summarize.outputs.block_percent }}
          NETWORK_PERCENT: ${{ steps.summarize.outputs.network_percent }}
          PERIOD_LABEL: ${{ steps.summarize.outputs.period_label }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY' > "$RUNNER_TEMP/telegram-message.txt"
          import os

          def env(name, default=''):
              return os.environ.get(name, default)

          status = env('STATUS')
          status_ko = {'ok': '정상', 'warning': '주의', 'critical': '위험'}.get(status, status or '알 수 없음')
          emoji = {'ok': '🟢', 'warning': '🟡', 'critical': '🔴'}.get(status, '⚪')

          message_ko = {
              'ok': '모든 모니터링 값이 설정된 임계치 안에 있습니다.',
              'warning': '일부 항목이 주의 임계치에 도달했습니다.',
              'critical': '일부 항목이 위험 임계치를 넘었습니다.',
          }.get(status, env('MESSAGE'))

          text = f"""{emoji} OCI 무료 티어 모니터링: {status_ko} — 전체 위험도 {env('OVERALL_RISK_PERCENT')}%

          {message_ko}

          📊 현재 사용량 (집계 구간: 이번 달 {env('PERIOD_LABEL')} 누적, UTC 기준)
          - 전체 위험도: {env('OVERALL_RISK_PERCENT')}%
          - A1 OCPU: {env('A1_OCPUS')} / {env('A1_FREE_OCPUS')} ({env('A1_OCPUS_PERCENT')}%) — 현재 점유량
          - A1 메모리: {env('A1_MEMORY_GB')} / {env('A1_FREE_MEMORY_GB')} GB ({env('A1_MEMORY_PERCENT')}%) — 현재 점유량
          - 부트+블록 볼륨: {env('BLOCK_TOTAL_GB')} / {env('BLOCK_FREE_GB')} GB ({env('BLOCK_PERCENT')}%) — 현재 점유량
          - 월간 VNIC 송신량 ({env('PERIOD_LABEL')} 누적): {env('VNIC_EGRESS_TIB')} / 10 TiB ({env('NETWORK_PERCENT')}%)
          - Usage API 계산 금액 ({env('PERIOD_LABEL')} 누적): {env('USAGE_COST')}

          🚧 임계치
          - A1 위험: {env('A1_FREE_OCPUS')} OCPU 초과 또는 {env('A1_FREE_MEMORY_GB')} GB 메모리 초과
          - 볼륨 주의: {env('BLOCK_WARNING_GB')} GB 이상
          - 볼륨 위험: {env('BLOCK_FREE_GB')} GB 초과
          - 네트워크 주의: 월 {env('NETWORK_WARNING_TB')} TiB 이상
          - 네트워크 위험: 월 {env('NETWORK_CRITICAL_TB')} TiB 이상
          - 과금 위험: Usage API 계산 금액이 0보다 큼

          참고: A1 100%는 무료 A1 한도 전체를 사용 중이라는 뜻이며, 그 자체로 초과 과금은 아닙니다.
          실행 로그: {env('RUN_URL')}"""
          print('\n'.join(line.strip() for line in text.splitlines()))
          PY

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode text@"$RUNNER_TEMP/telegram-message.txt" > /dev/null
          else
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set; printing notification text instead."
            cat "$RUNNER_TEMP/telegram-message.txt"
          fi

      - name: Notify Telegram with month-end closing report
        if: always() && github.event_name != 'pull_request' && steps.summarize.outputs.month_end_report == 'true'
        env:
          PREV_MONTH_LABEL: ${{ steps.summarize.outputs.prev_month_label }}
          PREV_VNIC_EGRESS_TIB: ${{ steps.summarize.outputs.prev_vnic_egress_tib }}
          PREV_USAGE_COST: ${{ steps.summarize.outputs.prev_usage_cost }}
          PREV_OUTBOUND_QUANTITY: ${{ steps.summarize.outputs.prev_outbound_quantity }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          python3 - <<'PY' > "$RUNNER_TEMP/telegram-month-end.txt"
          import os

          def env(name, default=''):
              return os.environ.get(name, default)

          cost = env('PREV_USAGE_COST', '0')
          try:
              billed = float(cost) > 0
          except ValueError:
              billed = False
          verdict = '🔴 과금 발생 — 확인 필요' if billed else '🟢 과금 없음 (무료 티어 내)'

          text = f"""📅 OCI 무료 티어 월간 마감 리포트: {env('PREV_MONTH_LABEL')}

          지난달 결산입니다. ({env('PREV_MONTH_LABEL')} 전체, UTC 기준)

          📊 월간 누적 사용량
          - VNIC 송신량: {env('PREV_VNIC_EGRESS_TIB')} / 10 TiB
          - Usage API 아웃바운드 수량: {env('PREV_OUTBOUND_QUANTITY')}
          - Usage API 계산 금액: {cost}

          🧾 결산 판정: {verdict}

          참고: VNIC 송신량은 현재 활성 VNIC 기준 추정치이며, 청구의 기준은 Usage API 계산 금액입니다.
          실행 로그: {env('RUN_URL')}"""
          print('\n'.join(line.strip() for line in text.splitlines()))
          PY

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode text@"$RUNNER_TEMP/telegram-month-end.txt" > /dev/null
          else
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set; printing month-end report instead."
            cat "$RUNNER_TEMP/telegram-month-end.txt"
          fi

      - name: Fail on critical threshold breach
        if: github.event_name != 'pull_request' && steps.summarize.outputs.status == 'critical'
        run: |
          echo "::error::OCI Free Tier monitor detected a critical threshold breach."
          exit 1
